# Fallout Forecast telemetry collector (HTTP on port 8080). See server/telemetry/README.md.
# Data is stored in the fallout-telemetry-data volume (/data in the container), one JSONL file per day.
services:
  fallout-telemetry:
    build: .
    image: fallout-telemetry:${TELEMETRY_TAG:-latest}
    container_name: fallout-telemetry
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    ports:
      - "8080:8080"
    volumes:
      - fallout-telemetry-data:/data
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  fallout-telemetry-data:
