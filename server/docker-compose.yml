# Fallout Forecast cloud server on ballista. See server/README.md.
# Caddy (coolify-proxy, caddy-docker-proxy) terminates TLS for
# fallout.drew.place and forwards the WebSocket to the container's port 7777.
# No host port is published.
services:
  fallout-server:
    image: fallout-server:${FALLOUT_TAG:-latest}
    container_name: fallout-server
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    networks: [coolify]
    labels:
      caddy: fallout.drew.place
      # Only WebSocket upgrades reach Godot; plain HTTP (browsers, scanners,
      # uptime checks) gets a 200 text reply from Caddy instead.
      caddy.@ws.header: Upgrade websocket
      caddy.@notws.not.header: Upgrade websocket
      caddy.reverse_proxy: "@ws {{upstreams 7777}}"
      caddy.respond: "@notws \"Fallout Forecast game server. Join from the game: wss://fallout.drew.place/\" 200"
      caddy_ingress_network: coolify
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  coolify:
    external: true
