# Fallout Forecast dedicated server (WebSocket on TCP 7777). See server/README.md.
# Place a TLS-terminating reverse proxy in front of port 7777 when serving wss://.
services:
  fallout-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: fallout-server:${FALLOUT_TAG:-latest}
    container_name: fallout-server
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    ports:
      - "7777:7777"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
