name: Web export

on:
  push:
    branches: [master, web-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the ARM64 web image
        run: docker build -f web/Dockerfile -t fallout-web:ci .

      - name: Check the launcher, compressed assets and cache headers
        shell: bash
        run: |
          docker run -d --name fallout-web-ci -p 127.0.0.1::8080 fallout-web:ci
          trap 'docker rm -f fallout-web-ci > /dev/null' EXIT
          url="http://$(docker port fallout-web-ci 8080/tcp)"
          curl -fsS --retry 5 --retry-connrefused "$url/healthz"
          curl -fsS -D "$RUNNER_TEMP/index.headers" -o "$RUNNER_TEMP/index.html" "$url/"
          grep -qi '^Cache-Control: no-store' "$RUNNER_TEMP/index.headers"
          version=$(sed -n 's|.*<base href="./\([a-f0-9]\{32\}\)/">.*|\1|p' "$RUNNER_TEMP/index.html")
          test -n "$version"

          check_asset() {
            headers=$(curl -fsSI -H 'Accept-Encoding: gzip' -H 'Via: 1.1 Caddy' "$url/$version/$1")
            grep -Fqi "Content-Type: $2" <<< "$headers"
            grep -Fqi 'Content-Encoding: gzip' <<< "$headers"
            grep -Fqi 'Cache-Control: public, max-age=31536000, immutable' <<< "$headers"
          }
          check_asset game.wasm application/wasm
          check_asset game.pck application/octet-stream
          check_asset game.js application/javascript
          mkdir "$RUNNER_TEMP/fallout-web"
          docker cp fallout-web-ci:/usr/share/nginx/html/index.html "$RUNNER_TEMP/fallout-web"
          docker cp "fallout-web-ci:/usr/share/nginx/html/$version" "$RUNNER_TEMP/fallout-web"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fallout-web-${{ github.sha }}
          path: ${{ runner.temp }}/fallout-web/
          if-no-files-found: error
          retention-days: 14
