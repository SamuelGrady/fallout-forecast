name: Native builds

# Windows and Linux desktop builds of the game, exported with the same pinned
# Godot 4.7.2 binary and checksummed templates as the web image. Every push to
# master uploads them as workflow artifacts; pushing a v* tag also attaches
# them to a GitHub Release.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Godot 4.7.2 and the desktop export templates
        shell: bash
        run: |
          set -eu
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --silent --show-error --location --retry 3 "$release/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          unzip -j /tmp/godot.zip Godot_v4.7.2-stable_linux.x86_64 -d /tmp
          sudo install /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --silent --show-error --location --retry 3 "$release/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz" | sha256sum --check
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -j /tmp/templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import and export
        shell: bash
        run: |
          set -eu
          godot --headless --import
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows Desktop" build/windows/FalloutForecast.exe
          godot --headless --export-release "Linux" build/linux/FalloutForecast.x86_64
          chmod +x build/linux/FalloutForecast.x86_64
          test -s build/windows/FalloutForecast.exe
          test -s build/linux/FalloutForecast.x86_64
          cp assets/fonts/VT323-OFL.txt build/windows/ && cp assets/fonts/VT323-OFL.txt build/linux/
          (cd build/windows && zip -9 -q ../FalloutForecast-windows-x86_64.zip *)
          (cd build && tar -czf FalloutForecast-linux-x86_64.tar.gz -C linux .)
          ls -la build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fallout-forecast-windows-${{ github.sha }}
          path: build/FalloutForecast-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fallout-forecast-linux-${{ github.sha }}
          path: build/FalloutForecast-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Fallout Forecast ${GITHUB_REF_NAME}" --generate-notes --repo "${GITHUB_REPOSITORY}" || true
          gh release upload "${GITHUB_REF_NAME}" build/FalloutForecast-windows-x86_64.zip build/FalloutForecast-linux-x86_64.tar.gz --clobber --repo "${GITHUB_REPOSITORY}"
