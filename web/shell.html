<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #0c1422;
      --surround: #05090f;
      --paper: #e8e9d5;
      --cyan: #66dfda;
      --pink: #ff5689;
      --amber: #ffbf68;
      --acid: #b8e56d;
      --muted: #aabac7;
      --panel: #14232d;
      --primary: #244d57;
      --hover: #2f626e;
      --inset-top: env(safe-area-inset-top, 0px);
      --inset-right: env(safe-area-inset-right, 0px);
      --inset-bottom: env(safe-area-inset-bottom, 0px);
      --inset-left: env(safe-area-inset-left, 0px);
      --height: 100vh;
      --safe-w: calc(100vw - var(--inset-left) - var(--inset-right));
      --safe-h: calc(var(--height) - var(--inset-top) - var(--inset-bottom));
      --stage-w: min(var(--safe-w), calc(var(--safe-h) * 4 / 3));
      --stage-h: min(var(--safe-h), calc(var(--safe-w) * 3 / 4));
      font-family: "VT323", ui-monospace, monospace;
      background: var(--surround);
      color: var(--paper);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--surround);
    }
    @supports (height: 100dvh) { :root { --height: 100dvh; } }
    #safe-area {
      position: absolute;
      top: var(--inset-top);
      left: var(--inset-left);
      width: var(--safe-w);
      height: var(--safe-h);
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: 0;
    }
    .touch-mode.in-run #canvas { touch-action: none; }
    #bezel {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--stage-w);
      height: var(--stage-h);
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      border: 1px solid rgba(102, 223, 218, .22);
      box-shadow: 0 0 42px rgba(0, 0, 0, .75);
      pointer-events: none;
      z-index: 2;
    }
    .touch-mode #bezel { width: 100%; height: 100%; }
    #bezel[hidden], :fullscreen #bezel { display: none; }
    #backdrop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surround);
      z-index: 5;
    }
    [hidden] { display: none !important; }
    #launch {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(.4rem, 1.8dvh, 1.3rem);
      padding: clamp(.8rem, 3vw, 2.8rem);
      text-align: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, #142838 0%, var(--ink) 74%);
      border: 2px solid rgba(102, 223, 218, .35);
      box-shadow: 0 0 60px rgba(0, 0, 0, .85);
    }
    @media (orientation: portrait) {
      #launch {
        width: min(100%, 32rem);
        height: min(100%, 36rem);
      }
      .osd.top-right, .osd.bottom-right { display: none; }
    }
    /* VHS overlay inside the 4:3 broadcast frame, matching the in-game title. */
    #launch::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .20) 0 2px, transparent 2px 4px);
      animation: roll 9s linear infinite;
    }
    #launch::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, .52) 100%);
    }
    @keyframes roll { from { background-position-y: 0; } to { background-position-y: 120px; } }
    .osd {
      position: absolute;
      font-size: clamp(1.25rem, 2.8vmin, 1.9rem);
      letter-spacing: .08em;
      color: #cceadb;
      text-shadow: 2px 2px 0 var(--ink);
      z-index: 1;
    }
    .osd.top-left { top: 4.5%; left: 5.2%; }
    .osd.top-right { top: 4.5%; right: 5.2%; }
    .osd.bottom-left { bottom: 4.5%; left: 5.2%; color: var(--muted); }
    .osd.bottom-right { bottom: 4.5%; right: 5.2%; color: var(--cyan); }
    .rec::before {
      content: "";
      display: inline-block;
      width: .52em;
      height: .52em;
      margin-right: .35em;
      border-radius: 50%;
      background: var(--pink);
      animation: blink 1.2s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #title {
      position: relative;
      z-index: 1;
      margin: 0;
      line-height: .82;
      font-weight: 400;
      font-size: clamp(3.6rem, 12.5vmin, 8.6rem);
      letter-spacing: .02em;
      user-select: none;
    }
    #title span { display: block; text-shadow: .035em .035em 0 #267e75; }
    #title .a { color: #e6eee2; }
    #title .b { color: #a9e9d9; }
    #actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: .85rem;
      flex-wrap: wrap;
      justify-content: center;
      width: min(100%, 34rem);
    }
    #start, #download {
      font: inherit;
      letter-spacing: .10em;
      text-transform: uppercase;
      box-sizing: border-box;
      border-radius: 0;
      cursor: pointer;
      transition: transform .10s ease, background .10s ease, border-color .10s ease, color .10s ease;
    }
    #start {
      flex: 1 1 auto;
      min-height: clamp(3.4rem, 8.5vmin, 4.4rem);
      padding: .45rem clamp(1rem, 3vw, 2.2rem);
      font-size: clamp(1.7rem, 4vmin, 2.3rem);
      color: var(--paper);
      background: var(--primary);
      border: 1px solid rgba(102, 223, 218, .55);
      border-left: 4px solid var(--cyan);
      box-shadow: 0 0 28px rgba(102, 223, 218, .18);
    }
    #start:hover:not(:disabled) {
      background: var(--hover);
      color: var(--cyan);
      border-color: var(--cyan);
      transform: scale(1.02);
    }
    #start:active:not(:disabled) { transform: scale(.985); }
    #start:disabled { opacity: .72; cursor: wait; }
    #download {
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(3.4rem, 8.5vmin, 4.4rem);
      padding: .45rem clamp(1rem, 2vw, 1.6rem);
      font-size: clamp(1.5rem, 3.6vmin, 2.0rem);
      text-decoration: none;
      color: var(--paper);
      background: var(--panel);
      border: 1px solid rgba(170, 186, 199, .38);
      border-left: 3px solid var(--muted);
    }
    #download:hover {
      background: #24424f;
      color: var(--cyan);
      border-color: var(--cyan);
      transform: scale(1.02);
    }
    button:focus-visible, #download:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    #status {
      position: relative;
      z-index: 1;
      min-height: 1.5rem;
      margin: 0;
      font-size: clamp(1.2rem, 2.8vmin, 1.55rem);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    #fullscreen, #audio, #controls {
      min-height: 44px;
      color: var(--paper);
      background: rgba(20, 35, 45, .92);
      border: 1px solid rgba(102, 223, 218, .55);
      border-left: 3px solid var(--cyan);
      border-radius: 0;
      padding: .35rem .85rem;
      font: inherit;
      font-size: 1.2rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #controls { position: relative; z-index: 1; }
    #fullscreen, #audio {
      position: absolute;
      bottom: .75rem;
      right: .9rem;
      z-index: 4;
    }
    #audio { bottom: auto; top: .65rem; }
    #fullscreen:hover, #audio:hover, #controls:hover {
      background: #24424f;
      color: var(--cyan);
      border-color: var(--cyan);
    }
    :fullscreen #fullscreen, .mouse-captured #fullscreen,
    .mouse-captured #audio, .touch-mode.in-run #fullscreen { display: none; }
    #rotate {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 1rem;
      background: rgba(5, 9, 15, .95);
      color: var(--cyan);
      font-size: clamp(1.6rem, 8vmin, 2.5rem);
    }
  </style>
</head>
<body>
  <div id="safe-area">
    <canvas id="canvas" tabindex="0" aria-label="$GODOT_PROJECT_NAME"></canvas>
    <div id="bezel" aria-hidden="true" hidden></div>
    <div id="backdrop">
      <main id="launch">
        <div class="osd top-left rec">REC</div>
        <div class="osd top-right">SP  OCT 31 1987</div>
        <h1 id="title" aria-label="Fallout Forecast"><span class="a">FALLOUT</span><span class="b">FORECAST</span></h1>
        <div id="actions">
          <button id="start" type="button">&gt; PLAY</button>
          <a id="download" href="https://github.com/kickofline/fallout-forecast/releases/tag/nightly" target="_blank" rel="noopener">DOWNLOAD</a>
        </div>
        <button id="controls" type="button">CONTROLS: AUTO</button>
        <p id="status" role="status"></p>
        <div class="osd bottom-left">CH 03</div>
        <div class="osd bottom-right">HI-FI STEREO</div>
      </main>
    </div>
    <div id="rotate" role="status" hidden>ROTATE TO LANDSCAPE</div>
    <button id="fullscreen" type="button" hidden>FULLSCREEN</button>
    <button id="audio" type="button" hidden>ENABLE AUDIO</button>
  </div>
  <script>
    // Track every AudioContext Godot creates and resume on any user gesture so
    // async WASM downloads never leave WebAudio stuck in "suspended".
    const audio = document.getElementById("audio");
    const updateAudio = (function () {
      const contexts = [];
      const isSuspended = ctx => ["suspended", "interrupted"].includes(ctx.state);
      const update = () => {
        audio.hidden = !document.getElementById("backdrop").hidden || !contexts.some(isSuspended);
      };
      const NativeAC = window.AudioContext || window.webkitAudioContext;
      if (NativeAC) {
        const WrappedAC = function (...args) {
          const ctx = new NativeAC(...args);
          contexts.push(ctx);
          ctx.addEventListener("statechange", update);
          update();
          return ctx;
        };
        WrappedAC.prototype = NativeAC.prototype;
        Object.setPrototypeOf(WrappedAC, NativeAC);
        if (window.AudioContext) window.AudioContext = WrappedAC;
        if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
        const unlock = () => {
          for (const ctx of contexts) {
            if (isSuspended(ctx)) ctx.resume().then(update).catch(() => {});
          }
        };
        window.addEventListener("pointerdown", unlock, { capture: true, passive: true });
        window.addEventListener("keydown", unlock, { capture: true, passive: true });
        window.addEventListener("touchstart", unlock, { capture: true, passive: true });
        window.addEventListener("touchend", unlock, { capture: true, passive: true });
        audio.addEventListener("click", () => {
          unlock();
          document.getElementById("canvas").focus();
        });
      }
      return update;
    })();
  </script>
  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const backdrop = document.getElementById("backdrop");
    const bezel = document.getElementById("bezel");
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const fullscreen = document.getElementById("fullscreen");
    const controls = document.getElementById("controls");
    const rotate = document.getElementById("rotate");
    const coarse = matchMedia("(pointer: coarse)");
    const modes = ["auto", "touch", "mouse"];
    let preference = "auto";
    try {
      const saved = localStorage.getItem("fallout-controls");
      if (modes.includes(saved)) preference = saved;
    } catch (_) {}
    let inRun = false;
    let browserCallback;

    const touchMode = () => preference === "touch" ||
      (preference === "auto" && coarse.matches && navigator.maxTouchPoints > 0);

    function updateLayout() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height) return;
      const landscape = width >= height;
      const touch = touchMode();
      document.body.classList.toggle("touch-mode", touch);
      document.body.classList.toggle("in-run", inRun);
      rotate.hidden = !inRun || !touch || landscape;
      controls.textContent = "CONTROLS: " + preference.toUpperCase();
      if (browserCallback) browserCallback(touch, landscape, document.hasFocus() &&
        document.visibilityState === "visible", height, canvas.height / height);
    }

    function resizeCanvas() {
      // Resize policy 0 leaves the backing store to the shell, so the render
      // surface can avoid cutouts and follow mobile browser bars.
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(canvas.clientWidth * scale));
      const height = Math.max(1, Math.round(canvas.clientHeight * scale));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      updateLayout();
    }

    window.falloutTouch = {
      subscribe(callback) {
        browserCallback = callback;
        updateLayout();
      },
      setRunVisible(value) {
        inRun = value;
        updateLayout();
      },
    };
    controls.addEventListener("click", () => {
      preference = modes[(modes.indexOf(preference) + 1) % modes.length];
      try { localStorage.setItem("fallout-controls", preference); } catch (_) {}
      updateLayout();
    });
    new ResizeObserver(resizeCanvas).observe(document.getElementById("safe-area"));
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("blur", updateLayout);
    window.addEventListener("focus", updateLayout);
    document.addEventListener("visibilitychange", () => { updateLayout(); updateAudio(); });
    // Godot's Web template forwards touchcancel as a release. Cancel the
    // gesture before the template sees that release.
    canvas.addEventListener("touchcancel", updateLayout, { capture: true, passive: true });
    coarse.addEventListener("change", updateLayout);
    resizeCanvas();
    // DOWNLOAD: point straight at the matching desktop build when we can tell the OS.
    (function () {
      const agent = navigator.userAgent.toLowerCase();
      const base = "https://github.com/kickofline/fallout-forecast/releases/download/nightly/";
      const link = document.getElementById("download");
      if (agent.includes("windows")) link.href = base + "FalloutForecast-windows-x86_64.zip";
      else if (agent.includes("linux") && !agent.includes("android")) link.href = base + "FalloutForecast-linux-x86_64.tar.gz";
    })();
    let gameRunning = false;

    async function lockGameKeys() {
      if (navigator.keyboard && typeof navigator.keyboard.lock === "function") {
        try {
          await navigator.keyboard.lock(["KeyW", "KeyA", "KeyS", "KeyD", "ControlLeft", "ControlRight", "Escape"]);
        } catch (_) {}
      }
    }

    function unlockGameKeys() {
      if (navigator.keyboard && typeof navigator.keyboard.unlock === "function") {
        try { navigator.keyboard.unlock(); } catch (_) {}
      }
    }

    fullscreen.addEventListener("click", async () => {
      try {
        await document.documentElement.requestFullscreen();
        await lockGameKeys();
      } catch (error) {
        console.warn("Fullscreen unavailable:", error.message);
      }
      canvas.focus();
    });
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        lockGameKeys();
      } else {
        unlockGameKeys();
      }
    });
    document.addEventListener("pointerlockchange", () => {
      document.body.classList.toggle("mouse-captured", document.pointerLockElement === canvas);
    });

    // Block accidental Ctrl+W (crouch + move forward), Ctrl+R, Ctrl+T, Ctrl+N, etc.
    window.addEventListener("keydown", (event) => {
      if (!gameRunning) return;
      if ((event.ctrlKey || event.metaKey) && ["KeyW", "KeyR", "KeyT", "KeyN", "KeyS", "KeyP", "Tab"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.key === "Escape" && document.fullscreenElement) {
        document.exitFullscreen().catch(console.warn);
      }
    }, { capture: true });

    // Outside fullscreen, browsers reserve Ctrl+W; prompt before closing so crouching + W never drops the game.
    window.addEventListener("beforeunload", (event) => {
      if (!gameRunning) return;
      event.preventDefault();
      event.returnValue = "";
    });

    start.addEventListener("click", async () => {
      start.disabled = true;
      status.textContent = "LOADING TAPE...";
      try {
        if (typeof Engine === "undefined") throw new Error("THE GAME SCRIPT COULD NOT LOAD.");
        const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
        if (missing.length) throw new Error(missing.join(". "));
        const engine = new Engine({ ...$GODOT_CONFIG, experimentalVK: true });
        await engine.startGame({
          canvas,
          onProgress(current, total) {
            if (total > 0) status.textContent = `LOADING TAPE... ${Math.floor(100 * current / total)}%`;
          },
        });
        gameRunning = true;
        backdrop.hidden = true;
        bezel.hidden = false;
        fullscreen.hidden = !document.fullscreenEnabled;
        updateAudio();
        canvas.focus();
      } catch (error) {
        start.disabled = false;
        status.textContent = `${error.message} RELOAD THIS PAGE TO TRY AGAIN.`;
        console.error(error);
      }
    });
  </script>
</body>
</html>
