<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: "VT323", ui-monospace, monospace; background: #0c1422; color: #e8e9d5; }
    body { margin: 0; overflow: hidden; background: #0c1422; }
    canvas { position: fixed; inset: 0; display: block; outline: 0; }
    #launch {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.5rem;
      padding: 1.5rem; text-align: center;
      background: radial-gradient(circle at 50% 45%, #162a3a 0%, #0c1422 72%);
    }
    #launch[hidden], #fullscreen[hidden] { display: none; }
    /* VHS overlay: scanlines and a soft vignette, like the in-game title. */
    #launch::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);
      animation: roll 9s linear infinite;
    }
    #launch::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    }
    @keyframes roll { from { background-position-y: 0; } to { background-position-y: 120px; } }
    .osd { position: absolute; top: 1.4rem; font-size: 2rem; letter-spacing: .08em; color: #e8e9d5; text-shadow: 2px 2px 0 #000; }
    .osd.left { left: 1.8rem; }
    .osd.right { right: 1.8rem; }
    .rec::before { content: ""; display: inline-block; width: .6em; height: .6em; margin-right: .35em; border-radius: 50%; background: #ff5689; animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #title { margin: 0; line-height: .82; font-weight: 400; font-size: clamp(4.5rem, 15vw, 10.5rem); letter-spacing: .02em; user-select: none; }
    #title span { display: block; text-shadow: .03em .03em 0 #267e75; }
    #title .a { color: #e6eee2; }
    #title .b { color: #a9e9d9; }
    #actions { display: flex; gap: .9rem; flex-wrap: wrap; justify-content: center; }
    #download {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 5.5rem; padding: 1.25rem 2rem; box-sizing: border-box;
      font: inherit; font-size: 2.2rem; letter-spacing: .12em; text-decoration: none;
      color: #e8e9d5; background: rgba(20, 35, 45, .88);
      border: 3px solid #e8e9d5; border-radius: .35rem; transition: transform .12s ease, background .12s ease;
    }
    #download:hover { background: #29545d; transform: scale(1.04); }
    #download:focus-visible { outline: 3px solid #ff5689; outline-offset: 4px; }
    #start {
      min-width: 18rem; min-height: 5.5rem; padding: 1.25rem 3.5rem;
      font: inherit; font-size: 2.6rem; letter-spacing: .14em; text-transform: uppercase;
      color: #e8e9d5; background: #1d3c4a;
      border: 3px solid #66dfda; border-radius: .35rem;
      box-shadow: 0 0 36px rgba(102, 223, 218, .28), inset 0 0 18px rgba(102, 223, 218, .12);
      cursor: pointer; transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }
    #start:hover:not(:disabled) {
      background: #29545d; transform: scale(1.04);
      box-shadow: 0 0 48px rgba(102, 223, 218, .48), inset 0 0 22px rgba(102, 223, 218, .22);
    }
    #start:active:not(:disabled) { transform: scale(.98); }
    #start:disabled { opacity: .75; cursor: wait; }
    #start:focus-visible, #fullscreen:focus-visible { outline: 3px solid #ff5689; outline-offset: 4px; }
    #status { min-height: 1.4rem; margin: 0; font-size: 1.5rem; letter-spacing: .08em; color: #66dfda; }
    @media (max-width: 560px) { .osd { font-size: 1.4rem; } #start, #download { min-width: 0; width: 100%; } #actions { width: 100%; } }
    #fullscreen {
      position: fixed; bottom: .75rem; left: 50%; transform: translateX(-50%);
      color: #e8e9d5; background: rgba(20, 35, 45, .88); border: 1px solid #66dfda;
      border-radius: .25rem; padding: .45rem .9rem; font: inherit; font-size: .875rem; cursor: pointer;
    }
    #fullscreen:hover { background: #29545d; }
    :fullscreen #fullscreen, .mouse-captured #fullscreen { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="$GODOT_PROJECT_NAME"></canvas>
  <main id="launch">
    <div class="osd left rec">REC</div>
    <div class="osd right">SP  OCT 31 1987</div>
    <h1 id="title" aria-label="Fallout Forecast"><span class="a">FALLOUT</span><span class="b">FORECAST</span></h1>
    <div id="actions">
      <button id="start" type="button">&#9654; PLAY</button>
      <a id="download" href="https://github.com/kickofline/fallout-forecast/releases/tag/nightly" target="_blank" rel="noopener">DOWNLOAD</a>
    </div>
    <p id="status" role="status"></p>
  </main>
  <button id="fullscreen" type="button" hidden>Fullscreen</button>
  <script>
    // Track every AudioContext Godot creates and resume on any user gesture so
    // async WASM downloads never leave WebAudio stuck in "suspended".
    (function () {
      const contexts = [];
      const NativeAC = window.AudioContext || window.webkitAudioContext;
      if (NativeAC) {
        const WrappedAC = function (...args) {
          const ctx = new NativeAC(...args);
          contexts.push(ctx);
          return ctx;
        };
        WrappedAC.prototype = NativeAC.prototype;
        Object.setPrototypeOf(WrappedAC, NativeAC);
        if (window.AudioContext) window.AudioContext = WrappedAC;
        if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
        const unlock = () => {
          for (const ctx of contexts) {
            if (ctx.state === "suspended") ctx.resume().catch(() => {});
          }
        };
        window.addEventListener("pointerdown", unlock, { capture: true, passive: true });
        window.addEventListener("keydown", unlock, { capture: true, passive: true });
        window.addEventListener("touchstart", unlock, { capture: true, passive: true });
      }
    })();
  </script>
  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const launch = document.getElementById("launch");
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const fullscreen = document.getElementById("fullscreen");
    // DOWNLOAD: point straight at the matching desktop build when we can tell the OS.
    (function () {
      const agent = navigator.userAgent.toLowerCase();
      const base = "https://github.com/kickofline/fallout-forecast/releases/download/nightly/";
      const link = document.getElementById("download");
      if (agent.includes("windows")) link.href = base + "FalloutForecast-windows-x86_64.zip";
      else if (agent.includes("linux") && !agent.includes("android")) link.href = base + "FalloutForecast-linux-x86_64.tar.gz";
    })();
    let gameRunning = false;

    async function lockGameKeys() {
      if (navigator.keyboard && typeof navigator.keyboard.lock === "function") {
        try {
          await navigator.keyboard.lock(["KeyW", "KeyA", "KeyS", "KeyD", "ControlLeft", "ControlRight", "Escape"]);
        } catch (_) {}
      }
    }

    function unlockGameKeys() {
      if (navigator.keyboard && typeof navigator.keyboard.unlock === "function") {
        try { navigator.keyboard.unlock(); } catch (_) {}
      }
    }

    fullscreen.addEventListener("click", async () => {
      try {
        await document.documentElement.requestFullscreen();
        await lockGameKeys();
      } catch (error) {
        console.warn("Fullscreen unavailable:", error.message);
      }
      canvas.focus();
    });
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        lockGameKeys();
      } else {
        unlockGameKeys();
      }
    });
    document.addEventListener("pointerlockchange", () => {
      document.body.classList.toggle("mouse-captured", document.pointerLockElement === canvas);
    });

    // Block accidental Ctrl+W (crouch + move forward), Ctrl+R, Ctrl+T, Ctrl+N, etc.
    window.addEventListener("keydown", (event) => {
      if (!gameRunning) return;
      if ((event.ctrlKey || event.metaKey) && ["KeyW", "KeyR", "KeyT", "KeyN", "KeyS", "KeyP", "Tab"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.key === "Escape" && document.fullscreenElement) {
        document.exitFullscreen().catch(console.warn);
      }
    }, { capture: true });

    // Outside fullscreen, browsers reserve Ctrl+W; prompt before closing so crouching + W never drops the game.
    window.addEventListener("beforeunload", (event) => {
      if (!gameRunning) return;
      event.preventDefault();
      event.returnValue = "";
    });

    start.addEventListener("click", async () => {
      start.disabled = true;
      status.textContent = "Loading...";
      try {
        if (typeof Engine === "undefined") throw new Error("The game script could not load.");
        const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
        if (missing.length) throw new Error(missing.join(". "));
        const engine = new Engine($GODOT_CONFIG);
        await engine.startGame({
          canvas,
          onProgress(current, total) {
            if (total > 0) status.textContent = `Loading... ${Math.floor(100 * current / total)}%`;
          },
        });
        gameRunning = true;
        launch.hidden = true;
        fullscreen.hidden = !document.fullscreenEnabled;
        canvas.focus();
      } catch (error) {
        start.disabled = false;
        status.textContent = `${error.message} Reload this page to try again.`;
        console.error(error);
      }
    });
  </script>
</body>
</html>
