server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Explicit types for the files fetched by the Godot loader.
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        image/png png;
        application/manifest+json webmanifest;
    }
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ "^/[a-f0-9]{32}/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
